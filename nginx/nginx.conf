# Formato de logs con campos que la IA leerá después:
# IP · timestamp · método · ruta · status · bytes · user-agent
log_format ia_json escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"protocol":"$server_protocol",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_length":$request_length,'
        '"request_time":$request_time,'
        '"user_agent":"$http_user_agent",'
        '"connection":$connection,'
        '"connection_requests":$connection_requests'
    '}';
                        
server {
    listen 80;
    server_name localhost;

    # ─────────────────────────────────────────────────────────
    #  Raíz del sitio estático (los archivos del Contramuseo)
    # ─────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;


    # Visible mediante: docker compose logs nginx
    access_log /dev/stdout ia_json;

    # Archivo persistente que leerá el detector en Python
    access_log /var/log/nginx/ia_access.jsonl ia_json;

    # Visible mediante los logs de Docker
    error_log /dev/stderr warn;

    # ─────────────────────────────────────────────────────────
    #  Archivos estáticos: servir directamente sin pasar por Flask
    # ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;  # SPA fallback
    }

    # Tipos MIME para audio (los podcasts del Contramuseo)
    location ~* \.(mp3|ogg|wav)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Caché agresivo para imágenes (no cambian seguido)
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ─────────────────────────────────────────────────────────
    #  Proxy inverso: las rutas /api/* van a Flask
    #  Así el navegador llama a localhost/api/... en vez de
    #  localhost:5000/... (mismo origen, sin problemas de CORS)
    # ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://flask-api:5000;  # nombre del servicio Docker
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
